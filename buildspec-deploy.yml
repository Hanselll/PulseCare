version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: "us-east-1"
    EKS_CLUSTER_NAME: "pulsecare-dev"
    MONITORING_RELEASE: "pulsecare-monitoring"
    APP_RELEASE: "pulsecare"

phases:
  install:
    commands:
      - set -e
      - echo "Installing kubectl"
      - curl -sSLo kubectl https://s3.us-west-2.amazonaws.com/amazon-eks/1.30.0/2024-05-12/bin/linux/amd64/kubectl
      - chmod +x kubectl
      - mv kubectl /usr/local/bin/kubectl
      - kubectl version --client
      - echo "Installing helm"
      - curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      - helm version

  pre_build:
    commands:
      - set -e
      - aws eks update-kubeconfig --region $AWS_DEFAULT_REGION --name $EKS_CLUSTER_NAME
      - kubectl get nodes
      - helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
      - helm repo update

  build:
    commands:
      - |
        set -e
        helm upgrade --install "$MONITORING_RELEASE" prometheus-community/kube-prometheus-stack \
          --namespace default \
          --values deploy/helm/monitoring-values.yaml \
          --wait \
          --timeout 10m

        if ! helm status "$APP_RELEASE" --namespace default >/dev/null 2>&1; then
          kubectl delete deployment postgres redis alert-service risk-scoring-service ingestion-service device-simulator --ignore-not-found
          kubectl delete service postgres redis alert-service risk-scoring-service ingestion-service device-simulator --ignore-not-found
          kubectl delete secret pulsecare-db-secret --ignore-not-found
          kubectl delete configmap pulsecare-app-config --ignore-not-found
          kubectl delete servicemonitor pulsecare-services --ignore-not-found
        fi

        helm upgrade --install "$APP_RELEASE" deploy/charts/pulsecare \
          --namespace default \
          --set global.imageTag=${CODEBUILD_RESOLVED_SOURCE_VERSION:0:7} \
          --wait \
          --timeout 10m

        kubectl rollout status deployment/postgres --timeout=240s
        kubectl rollout status deployment/redis --timeout=180s
        kubectl rollout status deployment/alert-service --timeout=240s
        kubectl rollout status deployment/risk-scoring-service --timeout=240s
        kubectl rollout status deployment/ingestion-service --timeout=240s
        kubectl rollout status deployment/device-simulator --timeout=240s

  post_build:
    commands:
      - kubectl get pods
      - kubectl get svc
      - kubectl get servicemonitor
      - helm list
