apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk-scoring-service
  labels:
    app: risk-scoring-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: risk-scoring-service
  template:
    metadata:
      labels:
        app: risk-scoring-service
    spec:
      containers:
        - name: risk-scoring-service
          image: 967002976835.dkr.ecr.us-east-1.amazonaws.com/pulsecare-risk-scoring-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: pulsecare-db-secret
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: pulsecare-app-config
                  key: REDIS_URL
            - name: ALERT_URL
              valueFrom:
                configMapKeyRef:
                  name: pulsecare-app-config
                  key: ALERT_URL
            - name: MEMORY_LEAK_MODE
              valueFrom:
                configMapKeyRef:
                  name: pulsecare-app-config
                  key: MEMORY_LEAK_MODE
            - name: SCORING_DELAY_MS
              valueFrom:
                configMapKeyRef:
                  name: pulsecare-app-config
                  key: SCORING_DELAY_MS
            - name: REDIS_LATENCY_MS
              valueFrom:
                configMapKeyRef:
                  name: pulsecare-app-config
                  key: REDIS_LATENCY_MS
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: risk-scoring-service
spec:
  selector:
    app: risk-scoring-service
  ports:
    - name: http
      port: 8000
      targetPort: 8000
