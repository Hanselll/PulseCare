apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.services.ingestion.name }}
spec:
  replicas: {{ .Values.services.ingestion.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.services.ingestion.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.services.ingestion.name }}
    spec:
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.global.initContainerImage }}
          command: ["sh", "-c", "until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done"]
      containers:
        - name: {{ .Values.services.ingestion.name }}
          image: {{ include "pulsecare.image" (dict "root" . "repository" .Values.services.ingestion.repository) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: pulsecare-db-secret
                  key: DATABASE_URL
            - name: SCORING_URL
              valueFrom:
                configMapKeyRef:
                  name: pulsecare-app-config
                  key: SCORING_URL
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.services.ingestion.name }}
  labels:
    app: {{ .Values.services.ingestion.name }}
spec:
  selector:
    app: {{ .Values.services.ingestion.name }}
  ports:
    - name: http
      port: 8000
      targetPort: 8000
