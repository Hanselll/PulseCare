version: 0.2

env:
  variables:
    AWS_ACCOUNT_ID: "967002976835"
    AWS_DEFAULT_REGION: "us-east-1"
    IMAGE_TAG: "latest"
    SERVICES: "ingestion-service risk-scoring-service alert-service device-simulator"

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - python -m pip install --upgrade pip
      - python -m pip install -e libs/pulsecare-core pytest ruff
      - python -m pip install -r services/ingestion-service/requirements.txt
      - python -m pip install -r services/risk-scoring-service/requirements.txt
      - python -m pip install -r services/alert-service/requirements.txt
      - python -m pip install -r services/device-simulator/requirements.txt

  pre_build:
    commands:
      - ruff check .
      - pytest
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - COMMIT_TAG=${CODEBUILD_RESOLVED_SOURCE_VERSION:0:7}

  build:
    commands:
      - |
        for SERVICE in $SERVICES; do
          REPOSITORY="pulsecare-$SERVICE"
          REPOSITORY_URI="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$REPOSITORY"
          echo "Building $SERVICE as $REPOSITORY_URI:$COMMIT_TAG"
          docker build -f "services/$SERVICE/Dockerfile" -t "$REPOSITORY:$IMAGE_TAG" .
          docker tag "$REPOSITORY:$IMAGE_TAG" "$REPOSITORY_URI:$IMAGE_TAG"
          docker tag "$REPOSITORY:$IMAGE_TAG" "$REPOSITORY_URI:$COMMIT_TAG"
        done

  post_build:
    commands:
      - |
        printf '[' > imagedefinitions.json
        FIRST=true
        for SERVICE in $SERVICES; do
          REPOSITORY="pulsecare-$SERVICE"
          REPOSITORY_URI="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$REPOSITORY"
          echo "Pushing $REPOSITORY_URI:$IMAGE_TAG"
          docker push "$REPOSITORY_URI:$IMAGE_TAG"
          echo "Pushing $REPOSITORY_URI:$COMMIT_TAG"
          docker push "$REPOSITORY_URI:$COMMIT_TAG"

          if [ "$FIRST" = true ]; then
            FIRST=false
          else
            printf ',' >> imagedefinitions.json
          fi
          printf '{"name":"%s","imageUri":"%s"}' "$SERVICE" "$REPOSITORY_URI:$COMMIT_TAG" >> imagedefinitions.json
        done
        printf ']' >> imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
